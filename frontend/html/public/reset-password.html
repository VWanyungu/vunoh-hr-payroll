<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var root = /^\/frontend(\/|$)/.test(location.pathname)
          ? "/frontend/"
          : "/";
        var base = document.createElement("base");
        base.href = root;
        document.head.appendChild(base);
      })();
    </script>
    <title>Reset password — Vunoh HR Payroll</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <main
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      "
    >
      <div class="card" style="width: 360px" id="reset-card">
        <h2 class="card-title">Reset password</h2>

        <form id="reset-form">
          <div class="input-group" style="margin-bottom: var(--space-4)">
            <label class="input-label" for="password">New password</label>
            <input
              class="input-field"
              id="password"
              type="password"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="input-group" style="margin-bottom: var(--space-4)">
            <label class="input-label" for="confirm-password"
              >Confirm new password</label
            >
            <input
              class="input-field"
              id="confirm-password"
              type="password"
              autocomplete="new-password"
              required
            />
          </div>

          <p
            id="reset-error"
            class="input-error-message"
            style="display: none; margin-bottom: var(--space-4)"
          ></p>

          <button
            class="btn btn-primary"
            type="submit"
            id="reset-submit"
            style="width: 100%"
          >
            Reset password
          </button>
        </form>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const card = document.getElementById("reset-card");
      const resetToken = new URLSearchParams(window.location.search).get(
        "resetToken",
      );

      if (!resetToken) {
        card.innerHTML = `
          <h2 class="card-title">Invalid reset link</h2>
          <p>This password reset link is missing its token. Please request a new one.</p>
          <p style="margin-top: var(--space-5); font-size: var(--text-sm);">
            <a href="html/public/forgot-password.html">Request a new link</a>
          </p>
        `;
      } else {
        const form = document.getElementById("reset-form");
        const errorEl = document.getElementById("reset-error");
        const submitBtn = document.getElementById("reset-submit");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          errorEl.style.display = "none";

          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirm-password").value;

          if (password !== confirmPassword) {
            errorEl.textContent = "Passwords do not match.";
            errorEl.style.display = "block";
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Resetting…";

          try {
            await apiPost(`/reset-password/${encodeURIComponent(resetToken)}`, {
              password,
            });
            window.location.href = "html/public/login.html";
          } catch (err) {
            // Covers the 15-minute TTL expiry as well as a malformed/already-used token.
            errorEl.textContent =
              err.message ||
              "This reset link is invalid or has expired. Please request a new one.";
            errorEl.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.textContent = "Reset password";
          }
        });
      }
    </script>
  </body>
</html>
