<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var root = /^\/frontend(\/|$)/.test(location.pathname) ? "/frontend/" : "/";
        var base = document.createElement("base");
        base.href = root;
        document.head.appendChild(base);
      })();
    </script>
    <title>Forgot password — Vunoh HR Payroll</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <main
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      "
    >
      <div class="card" style="width: 360px" id="forgot-card">
        <h2 class="card-title">Forgot password</h2>
        <p
          style="
            margin-bottom: var(--space-4);
            font-size: var(--text-sm);
            color: var(--color-grey-700);
          "
        >
          Enter your account email and we'll send you a link to reset your
          password.
        </p>

        <form id="forgot-form">
          <div class="input-group" style="margin-bottom: var(--space-4)">
            <label class="input-label" for="email">Email</label>
            <input
              class="input-field"
              id="email"
              type="email"
              autocomplete="username"
              required
            />
          </div>

          <p
            id="forgot-error"
            class="input-error-message"
            style="display: none; margin-bottom: var(--space-4)"
          ></p>

          <button
            class="btn btn-primary"
            type="submit"
            id="forgot-submit"
            style="width: 100%"
          >
            Send reset link
          </button>
        </form>

        <p style="margin-top: var(--space-5); font-size: var(--text-sm)">
          <a href="html/public/login.html">Back to log in</a>
        </p>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script>
      const form = document.getElementById("forgot-form");
      const errorEl = document.getElementById("forgot-error");
      const submitBtn = document.getElementById("forgot-submit");
      const card = document.getElementById("forgot-card");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";

        try {
          const email = document.getElementById("email").value.trim();

          // The API response also includes a `resetLink` field (a known gap,
          // see FRONTEND_SCREENS.md §6.2) — it must never be read or shown here,
          // regardless of what the response contains.
          await apiPost("/forgot-password", { email });

          card.innerHTML = `
            <h2 class="card-title">Check your email</h2>
            <p>If an account exists for that email address, we've sent a link to reset your password.</p>
            <p style="margin-top: var(--space-5); font-size: var(--text-sm);">
              <a href="html/public/login.html">Back to log in</a>
            </p>
          `;
        } catch (err) {
          errorEl.textContent =
            err.message || "Something went wrong. Please try again.";
          errorEl.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Send reset link";
        }
      });
    </script>
  </body>
</html>
