<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Vunoh HR Payroll</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <!-- Placeholder screen — real Dashboard (frontend/FRONTEND_SCREENS.md §3.1) is a separate task. -->
    <div style="display: flex;">
      <div id="sidebar-slot"></div>
      <div style="flex: 1;">
        <div id="topbar-slot"></div>
        <main style="padding: var(--space-8);">
          <div class="card">Dashboard not yet built.</div>
        </main>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
      requireAuth();
      document.getElementById("sidebar-slot").innerHTML = renderSidebar(getRoleNames(), "dashboard");
      document.getElementById("topbar-slot").innerHTML = renderTopbar("Dashboard");
      document.querySelector('[data-action="logout"]').addEventListener("click", async (e) => {
        e.preventDefault();
        try {
          await apiPost("/logout", { token: getAccessToken(), refreshToken: getRefreshToken() });
        } finally {
          clearTokens();
          window.location.href = "/html/public/login.html";
        }
      });
    </script>
  </body>
</html>
