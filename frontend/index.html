<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var root = /^\/frontend(\/|$)/.test(location.pathname) ? "/frontend/" : "/";
        var base = document.createElement("base");
        base.href = root;
        document.head.appendChild(base);
      })();
    </script>
    <title>Vunoh HR Payroll</title>
    <script src="js/auth.js"></script>
    <script>
      window.location.replace(
        getAccessToken()
          ? "html/app/dashboard.html"
          : "html/public/login.html",
      );
    </script>
  </head>
  <body></body>
</html>
